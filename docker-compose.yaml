# Production stack on the VPS (design §9.2): Postgres, Mosquitto with a login per station,
# collector, dashboard and daily backups. The home stack, which uses the user's own broker, is
# docker-compose.home.yaml.
# Coolify: a "Docker Compose" resource pointing at this repository (this is the file it looks for).
# Without Coolify: docker compose --env-file .env up -d --build
# Variables: .env.production.example. Guide: docs/deploy.md.

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: weather
      POSTGRES_DB: weather
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "weather", "-d", "weather"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  mosquitto:
    build: ./infra/mosquitto
    restart: unless-stopped
    environment:
      # Creates the "admin" client (used by the dashboard) on the first start.
      MOSQUITTO_DYNSEC_PASSWORD: ${MOSQUITTO_DYNSEC_PASSWORD:?set MOSQUITTO_DYNSEC_PASSWORD}
    ports:
      # The stations connect here, from the internet, without TLS (design §3.10).
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  collector:
    build:
      context: .
      target: collector
    restart: unless-stopped
    environment:
      # The password goes apart from the URL: inside it, a % sequence or a line break would
      # silently change it.
      DATABASE_URL: postgres://weather@postgres:5432/weather
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_COLLECTOR_PASSWORD: ${MQTT_COLLECTOR_PASSWORD:?set MQTT_COLLECTOR_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Both apps wait for the database and keep retrying the broker; the dashboard creates the
    # collector's login when it starts.
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  dashboard:
    build:
      context: .
      target: dashboard
    restart: unless-stopped
    environment:
      # The password goes apart from the URL: inside it, a % sequence or a line break would
      # silently change it.
      DATABASE_URL: postgres://weather@postgres:5432/weather
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MQTT_URL: mqtt://mosquitto:1883
      MOSQUITTO_DYNSEC_PASSWORD: ${MOSQUITTO_DYNSEC_PASSWORD:?set MOSQUITTO_DYNSEC_PASSWORD}
      MQTT_COLLECTOR_PASSWORD: ${MQTT_COLLECTOR_PASSWORD:?set MQTT_COLLECTOR_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      APP_URL: ${APP_URL:?set APP_URL}
      PUBLIC_MQTT_HOST: ${PUBLIC_MQTT_HOST:?set PUBLIC_MQTT_HOST}
      PUBLIC_MQTT_PORT: ${PUBLIC_MQTT_PORT:-1883}
      PUBLIC_MQTT_TLS: "false"
      # Coolify's proxy (and the Cloudflare tunnel, if any) is in front of the dashboard.
      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Reached only through the proxy: Coolify routes the domain to this port.
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  backup:
    build: ./infra/backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: weather
      PGDATABASE: weather
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${BACKUP_TZ:-America/Sao_Paulo}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - backups:/backups
      - mosquitto-data:/mosquitto-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

volumes:
  pgdata:
  mosquitto-data:
  backups:
