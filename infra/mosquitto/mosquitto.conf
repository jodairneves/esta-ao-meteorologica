# Production broker (design §3.10): plain MQTT on 1883, published on the host for the stations,
# with a login of its own for each station (Dynamic Security). No TLS, by the user's decision
# (design §3.10): logins and data cross the internet in clear text.

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Persistent sessions (stations and collector) keep QoS 1 messages while offline.
max_queued_messages 100000
persistent_client_expiration 30d

# The largest message is a telemetry batch of 30 readings (a few kB): a client that sends
# anything far bigger is disconnected.
max_packet_size 65536

listener 1883 0.0.0.0
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
