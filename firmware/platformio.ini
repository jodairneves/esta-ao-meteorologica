; Firmware of the weather station (Wemos D1 mini / ESP8266). Design: docs/superpowers/specs,
; sections 3 (MQTT contract v1) and 4 (firmware).
;
;   pio run -e d1_mini              build
;   pio run -e d1_mini -t upload    flash over USB
;   pio test -e native              unit tests of the hardware-free logic (src/core)

[platformio]
default_envs = d1_mini

[env]
lib_deps =
  bblanchon/ArduinoJson@^7.4.2

[env:d1_mini]
platform = espressif8266@^4.2.1
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
build_flags =
  -std=gnu++17
  -DFW_VERSION=\"1.0.0\"
  ; Password of the configuration access point (documented in docs/hardware.md).
  -DPORTAL_PASSWORD=\"12345678\"
  ; Configuration portal in Portuguese (include/wm_strings_pt_br.h). The library is built apart
  ; from the project sources, so it needs the include folder in its path too.
  -DWM_STRINGS_FILE=\"wm_strings_pt_br.h\"
  -I include
  ; Smaller lwIP buffers leave room for the TLS session.
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -DNDEBUG
build_unflags = -std=gnu++11 -std=gnu++14
; Strict warnings for the project sources only (not the framework or the libraries).
build_src_flags = -Wall -Wextra
lib_deps =
  ${env.lib_deps}
  256dpi/MQTT@^2.5.2
  tzapu/WiFiManager@^2.0.17
  adafruit/Adafruit BME280 Library@^2.2.4

[env:native]
platform = native
test_framework = unity
; Only the hardware-free logic is built for the host.
build_src_filter = -<*> +<core/>
test_build_src = yes
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -DUNIT_TEST
